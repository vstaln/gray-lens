[package]
name = "gray-lens"
version = "0.1.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Post-edit diagnostics: run the right language checker on file tools and append findings to the tool result."

[[bin]]
name = "gray-lens"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
